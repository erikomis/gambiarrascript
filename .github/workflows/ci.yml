# CI leve: gofmt + vet + testes a cada push/PR na main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (codigo formatado)
        run: |
          naoformatados=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$naoformatados" ]; then
            echo "::error::rode gofmt -w nesses arquivos:"
            echo "$naoformatados"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # conecta/consulta/executa, gs migra e migra() contra postgres e mysql de
  # verdade (no testa so roda sqlite; os testes *Integracao* pulam sem as
  # variaveis). -p 1 porque os pacotes dividem o banco e a gs_migracoes.
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gs
          POSTGRES_PASSWORD: gs
          POSTGRES_DB: gs_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gs -d gs_teste"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: raiz
          MYSQL_DATABASE: gs_teste
          MYSQL_USER: gs
          MYSQL_PASSWORD: gs
        ports:
          - 3306:3306
        # -h 127.0.0.1: o servidor temporario do init nao ouve TCP, entao so
        # fica saudavel quando o mysql de verdade sobe
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ugs -pgs"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      GS_TESTE_POSTGRES: postgres://gs:gs@127.0.0.1:5432/gs_teste?sslmode=disable
      GS_TESTE_MYSQL: mysql://gs:gs@127.0.0.1:3306/gs_teste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: testes de integracao (postgres 16 + mysql 8)
        run: |
          set -o pipefail
          go test -count=1 -p 1 -v -run 'Integracao' ./interpreter ./migracao ./cmd/gs | tee /tmp/banco.log
          # com as variaveis setadas nada pode pular calado
          if grep -q -- '--- SKIP' /tmp/banco.log; then
            echo "::error::teste de integracao pulou com o banco no ar"
            exit 1
          fi

  # O pages.yml so roda na main e falha DEPOIS do push; aqui a doc quebrada
  # (MDX com {chaves} fora de codigo, link morto...) e pega no PR.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: wasm + site estatico
        env:
          NEXT_PUBLIC_BASE_PATH: /gambiarrascript
        run: ./scripts/build-web --site

  # Playground de verdade em Chromium, Firefox e WebKit (Safari): exemplo,
  # busca avisando na hora, Parar num laco infinito, entrada (pergunta) e o
  # botao "Rodar no playground" da doc.
  navegadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: wasm + site estatico
        env:
          NEXT_PUBLIC_BASE_PATH: /gambiarrascript
        run: ./scripts/build-web --site

      - name: playwright + navegadores
        working-directory: web/e2e
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium firefox webkit

      - name: testa nos tres motores
        run: |
          mkdir -p /tmp/site && ln -s "$PWD/web/out" /tmp/site/gambiarrascript
          (cd /tmp/site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          cd web/e2e && BASE=http://localhost:8765/gambiarrascript node navegadores.cjs
