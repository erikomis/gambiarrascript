# Release: ao dar push de uma tag v* (ex: v0.2.0) testa, cross-compila o gs
# pras 5 plataformas, empacota a extensao do VSCode, publica um GitHub
# Release com notas automaticas + checksums.txt e sobe a imagem Docker
# multi-arch (linux/amd64 + linux/arm64) em ghcr.io/erikomis/gambiarrascript
# com a tag da versao e :latest (pre-release, tag com hifen, nao mexe no
# :latest).
#
# Rodar na mao (Actions > release > Run workflow) e um ensaio: monta tudo
# (imagem Docker inclusive, com o smoke test) e sobe como artifact da run,
# mas NAO publica release nem imagem nenhuma.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'versao do ensaio (sem v); nada e publicado'
        required: false
        default: '0.0.0-ensaio'

permissions:
  contents: write
  packages: write # push da imagem no ghcr.io com o GITHUB_TOKEN

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: versao
        id: versao
        env:
          VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${VERSAO_MANUAL:-0.0.0-ensaio}"
            v="${v#v}"
          fi
          case "$v" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::versao invalida: '$v'"; exit 1 ;;
          esac
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          echo "versao: $v"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: extensao VSCode (.vsix)
        working-directory: editors/vscode
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npm version "$VERSAO" --no-git-tag-version --allow-same-version
          mkdir -p ../../dist/release
          npx --yes @vscode/vsce@3 package \
            -o "../../dist/release/gambiarrascript-$VERSAO.vsix"

      - name: binarios + checksums + formula
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: ./scripts/release "$VERSAO"

      # ---- imagem Docker (packaging/docker/Dockerfile) ----
      # Reaproveita os binarios linux que o scripts/release acabou de gerar:
      # nada e compilado dentro do Docker, e a imagem carrega o MESMO gs dos
      # tarballs do release.
      - name: docker - contexto e tags
        id: docker
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
          REPO: ${{ github.repository }}
        run: |
          ctx=dist/docker
          rm -rf "$ctx"
          mkdir -p "$ctx/app"
          touch "$ctx/app/.mantem"
          for arch in amd64 arm64; do
            mkdir -p "$ctx/linux_$arch"
            tar -xzf "dist/release/gs_${VERSAO}_linux_${arch}.tar.gz" -C "$ctx/linux_$arch" gs
          done
          imagem="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          tags="$imagem:$VERSAO"
          # pre-release (versao com hifen) nao move o :latest
          case "$VERSAO" in *-*) ;; *) tags="$tags,$imagem:latest" ;; esac
          publica=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publica=true
          fi
          {
            echo "imagem=$imagem"
            echo "tags=$tags"
            echo "publica=$publica"
          } >> "$GITHUB_OUTPUT"
          echo "tags: $tags (publica: $publica)"

      - uses: docker/setup-buildx-action@v3

      - name: docker - login no ghcr.io
        if: steps.docker.outputs.publica == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # so amd64 e carregada no daemon local, pro smoke test conseguir rodar
      - name: docker - imagem de teste (amd64)
        uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          build-args: VERSAO=${{ steps.versao.outputs.versao }}
          load: true
          push: false
          tags: gambiarrascript:smoke

      - name: docker - smoke test
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -o pipefail
          docker run --rm gambiarrascript:smoke versao | tee /tmp/versao.txt
          grep -qF "$VERSAO" /tmp/versao.txt
          # roda um .gs montado em /app (o WORKDIR da imagem)
          docker run --rm -v "$PWD/examples:/app:ro" gambiarrascript:smoke roda salve.gs | tee /tmp/salve.txt
          grep -qF "Salve, tropa!" /tmp/salve.txt

      - name: docker - multi-arch (push so em tag)
        uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSAO=${{ steps.versao.outputs.versao }}
          push: ${{ steps.docker.outputs.publica == 'true' }}
          tags: ${{ steps.docker.outputs.tags }}

      - name: resumo (formula Homebrew pra copiar)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
          TAGS_DOCKER: ${{ steps.docker.outputs.tags }}
          PUBLICA_DOCKER: ${{ steps.docker.outputs.publica }}
        run: |
          {
            echo "## Release $VERSAO"
            echo
            echo '### checksums.txt'
            echo '```'
            cat dist/release/checksums.txt
            echo '```'
            echo
            echo '### Formula Homebrew (cole em erikomis/homebrew-tap: Formula/gambiarrascript.rb)'
            echo '```ruby'
            cat dist/release/gambiarrascript.rb
            echo '```'
            echo
            echo '### Imagem Docker'
            echo "tags: $TAGS_DOCKER (publicada: $PUBLICA_DOCKER)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gs-${{ steps.versao.outputs.versao }}
          path: dist/release/
          if-no-files-found: error

      - name: publica o release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          extra=()
          # tag com hifen (v1.0.0-rc1) vira pre-release
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GambiarraScript $TAG" \
            --generate-notes \
            --verify-tag \
            "${extra[@]}" \
            dist/release/gs_* \
            dist/release/*.vsix \
            dist/release/checksums.txt

      # Atualiza o tap do Homebrew (erikomis/homebrew-tap) com a formula ja
      # preenchida. Usa uma deploy key com escrita SO no repo do tap (secret
      # TAP_DEPLOY_KEY) — nada de token pessoal. Pre-release fica de fora: o
      # `brew install` sempre pega a ultima estavel.
      - name: atualiza o tap do Homebrew
        if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::sem TAP_DEPLOY_KEY: cole a formula do summary no tap na mao"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone -q git@github.com:erikomis/homebrew-tap.git tap
          # o template tem um cabecalho explicando o preenchimento; no tap
          # vai so a formula, a partir da linha `class`
          sed -n '/^class /,$p' dist/release/gambiarrascript.rb > tap/Formula/gambiarrascript.rb
          cd tap
          if git diff --quiet; then
            echo "formula ja esta na $VERSAO"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "gambiarrascript $VERSAO"
          git push -q origin HEAD:main
          echo "tap atualizado pra $VERSAO"
